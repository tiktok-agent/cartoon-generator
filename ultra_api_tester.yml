name: Ultra API Tester

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: pip install requests pillow gradio_client -q

      - name: Run tests
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python test_alle_apis.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultaten
          path: test_outputs/
          retention-days: 7
